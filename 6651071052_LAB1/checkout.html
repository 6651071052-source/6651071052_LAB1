<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thanh toán đơn hàng SafeKid.">
  <title>Thanh toán | SafeKid</title><link rel="stylesheet" href="Styles/main.css">
  <script defer src="Scripts/products.js"></script><script defer src="Scripts/guides.js"></script><script defer src="Scripts/hospitals.js"></script><script defer src="Scripts/app.js"></script>
</head>
<body data-page="checkout">
  <header id="siteHeader"></header>
  <main><section class="page-title"><div class="container"><h1>Thanh toán</h1><p>Điền thông tin nhận hàng để hoàn tất đơn demo</p></div></section>
    <div class="container breadcrumb"><a href="index.html">Trang chủ</a> &nbsp;›&nbsp; <a href="shoping-cart.html">Giỏ hàng</a> &nbsp;›&nbsp; Thanh toán</div>
    <div class="container checkout-layout">
      <form id="checkoutForm" class="form-section" novalidate>
        <div class="success-message" data-order-success hidden></div>
        <h2>Thông tin giao hàng</h2>
        <div class="form-grid">
          <div class="form-field"><label for="fullName">Họ và tên *</label><input id="fullName" name="name" autocomplete="name" required></div>
          <div class="form-field"><label for="phone">Số điện thoại * (chỉ nhập chữ số)</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" pattern="[0-9]{9,12}" required></div>
          <div class="form-field full"><label for="email">Email *</label><input id="email" name="email" type="email" autocomplete="email" required></div>
          <div class="form-field"><label for="province">Tỉnh / thành phố *</label><input id="province" name="province" autocomplete="address-level1" required></div>
          <div class="form-field"><label for="district">Quận / huyện *</label><input id="district" name="district" autocomplete="address-level2" required></div>
          <div class="form-field full"><label for="address">Địa chỉ cụ thể *</label><input id="address" name="address" autocomplete="street-address" required></div>
          <div class="form-field full"><label for="note">Ghi chú đơn hàng</label><textarea id="note" name="note" placeholder="Ghi chú giao hàng (không bắt buộc)"></textarea></div>
        </div>
        <div class="payment-options"><h2>Phương thức thanh toán</h2>
          <label><input type="radio" name="payment" value="cod" checked> Thanh toán khi nhận hàng (demo)</label>
          <label><input type="radio" name="payment" value="bank"> Chuyển khoản (chưa tích hợp thanh toán)</label>
        </div>
        <button class="button button-primary button-block" type="submit">ĐẶT HÀNG</button>
        <p class="fine-print">Bản demo không gửi dữ liệu ra máy chủ và không phát sinh thanh toán thật.</p>
      </form>
      <aside class="summary-card"><div class="coupon-form"><label for="coupon">Mã giảm giá</label><div><input id="coupon" placeholder="Nhập SAFE10"><button class="button button-outline" data-action="coupon">ÁP DỤNG</button></div><small data-coupon-status>Dùng mã SAFE10 để giảm 10% (demo).</small></div><div data-checkout-order></div></aside>
    </div>
  </main>
  <div id="siteFooter"></div><a class="emergency-fab" href="emergency.html" aria-label="Mở trang cấp cứu">✚ &nbsp; CẤP CỨU</a>
</body>
</html>
